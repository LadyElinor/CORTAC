name: S2 pinned assignment scheduling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: cortac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LadyElinor/unfinished-commonwealth
          ref: 3688dcdfa70b27531c8f0d3bd315a88736c87655
          persist-credentials: false
          path: commonwealth
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install separate client and CORTAC distributions
        run: python -m pip install --no-deps ./commonwealth/client_dist ./cortac
      - name: Check installed scheduler outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m wac_offline.scheduler_v1.demo
      - name: Check shared reservations with pinned loopback transport
        run: python cortac/scripts/scheduler_commonwealth_integration.py commonwealth
